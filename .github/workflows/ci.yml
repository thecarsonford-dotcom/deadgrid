name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted verification script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch proposed commits
        run: git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
      - name: Verify contributor sign-offs
        run: node scripts/check-dco.mjs "${{ github.event.pull_request.base.sha }}" pr-head

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run check
